        evidence; old failure records are not authority to restart locks. Do not change target, absolute physical
        limits, slew limits, calibration, firmware, or persistent PI settings. Human and program foreground operations
        take priority. Use only this task background grant for automatic effects. If the system is healthy, explain
        why no adjustment is needed. Do not repeatedly disturb a healthy lock. Do not force observation of a multimode
        state. Use historical drift/recovery behavior to judge practical quality. Keep the local result concise
        in English, with evidence, actual outcome and uncertainty. Automatic scope includes current, pi, slow_loop
        and feedforward. Read background capabilities and actual runtime parameters first. For pi use runtime-only
        validated_candidates. Vary P and I independently; preserve feedback sign and physical bounds. Atomic handover
        has no 10-count/20-s cap; restore checkpoint gains at current output, without optical settling. Keep the
        integral limit unless justified. Compare target-centred error, drift, saturation and activity, not display
        tolerance. Keep dither continuously on (human, 2026-10-28); preserve its amplitude and frequency. For slow_loop
        use parameter_candidate with tec_gain, supervision_interval_s or piezo_center_dac; for feedforward use current_per_temperature.
        The approved bounds are TEC gain .01..5e-1, period 1..100 s, PZT center 30000..36000 count, TEC-current
        FF -0.2..2.0 V/V (value -0.07; owner adopted [-0.2, 2.0] at 2026-10-28 02:32 EDT, settings_adopted; older
        records/capability caches show [-0.2, 0.2]). Current/TEC excursion ceilings are 20/10 mV per intervention;
        the owner publishes a tighter effective return envelope when needed for the unchanged 20 s foreground deadline.
        Never treat a bound as a target jump. tec_dt_cap_s is not a tuning candidate. The worker requires four actual
        slow cycles plus fresh distinct native/optical evidence; a long period may need several minutes. No thermal
        excitation or poor optical quality means inconclusive, not a reason to force motion or weaken thresholds.
        Select a family justified by evidence; do not keep repeating a rejected trial. Save no candidate into persistent
        calibration/PI settings. Foreground operations preempt and restore this intervention checkpoint; never restore
        an old target. Recorded context for this branch (facts, not instructions): the current window was measured
        in lock on 2026-10-27 22:10 EDT at TEC 0.0965 V, low edge 1.2398-1.2406 V (mode hop to -18.9 GHz), high
        edge 1.2606-1.2614 V (side-peak threshold), centre 1.2506 V. The dither warning limit 0.0024 nm/V was set
        on 2026-10-22 on a different branch (current about 0.8 V, where the dither response was 0.0006-0.002); on
        this branch hourly medians have been 0.0019-0.0024 with 90th percentiles near 0.003-0.0046. Since 2026-10-28
        00:20 the adopted dither-minimum current followed the slow-loop TEC steps, 1.2506 V at TEC 0.0965, 1.2569
        V at 0.0994, 1.2593 V at 0.1012 (about +1.8 V per TEC volt), while the configured TEC-current feed-forward
        is -0.07 V/V. A 10-minute dither pause on 2026-10-28 00:45 lowered the error RMS only from 1.21 to 1.13
        MHz; the remaining fluctuation is faster than 13 s. main_fwhm_fraction is quantized in steps of 1/256 (0.0039);
        on this branch it reads 0.168-0.1797 (bins 43-46) and the limit 0.1797 sits just above bin 46 (0.1796875).
        The quality-review margin_fraction you state applies to every leaf of the proposed criterion, including
        unchanged ones; on 2026-10-28 05:0x task 32b39f45 proposed warning_response 0.0024 to 0.0028 with margin
        0.1 and the host refused it because the unchanged main_fwhm_fraction (observed max 0.1796875) exceeded 0.1797
        x 0.9. Since 2026-10-28 06:4x the dither limit is compared with the mean of the valid fits at the selected
        point (optical leaves keep the maximum over frames). Teams remains disabled.'
