- id: pi-optimization
  operation: agent.task
  uses: []
  parameters:
    agent_card_id: diagnostic-agent
    prompt: Use the registered PI adjustment instructions and the existing approved plan. Assess whether PI tuning
      is justified from fresh owner evidence, target-centred error, drift, saturation and control activity. Compare
      P and I independently and integral limits where the owner supports them. Adopt only a measured improvement;
      otherwise retain the checkpoint. Do not change the target, physical bounds, slew limits, calibration or firmware.
      Foreground operations take priority. Report evidence and uncertainty. Teams notifications remain disabled.
    instruction_profile: adjustment
    execution_profile: ''
    request_delegation: true
    lookback_s: 3600.0
    sample_interval_s: 1.0
    timeout_s: 1800.0
    monitor_job_id: ''
    evidence_images: []
    adjustment_family: pi
    adjustment_plan_card_id: agent-monitor
    adjustment_objective: ''
    adoption_mode: auto_within_approved
  agent_execution:
    mode: required
    difficulty: standard
    escalation_profiles: []
- id: current-optimization
  operation: agent.task
  uses: []
  parameters:
    agent_card_id: diagnostic-agent
    prompt: Use the registered current adjustment instructions and the existing approved plan. If optical quality
      warrants adjustment, investigate small evidence-guided current changes, use the selected fresh observables
      and retain the best practical measured point. Do not require a multimode observation or invent unmeasured
      boundaries. Review quality thresholds against ordinary variability, drift and practical intervention frequency.
      Preserve the target, physical bounds, slew limits, calibration and firmware. Foreground operations take priority.
      Report evidence and uncertainty. Teams notifications remain disabled.
    instruction_profile: adjustment
    execution_profile: ''
    request_delegation: true
    lookback_s: 3600.0
