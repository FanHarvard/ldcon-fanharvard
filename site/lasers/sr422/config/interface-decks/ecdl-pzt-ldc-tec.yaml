- id: agent-adjust
  operation: agent.task
  uses: []
  parameters:
    agent_card_id: diagnostic-agent
    instruction_profile: adjustment
    execution_profile: ''
    request_delegation: true
    timeout_s: 1800.0
    lookback_s: 3600.0
    prompt: Teams notifications are disabled. Do not post or enqueue Teams messages. Use current owner and recorded
      evidence; old failure records are not authority to restart locks. Do not change target, absolute physical
      limits, slew limits, calibration, firmware, or persistent PI settings. Human and program foreground operations
      take priority. Use only this task background grant for automatic effects. If the system is healthy, explain
      why no adjustment is needed. Do not repeatedly disturb a healthy lock. Do not force observation of a multimode
      state. Use historical drift/recovery behavior to judge practical quality. Keep the local result concise in
      English, with evidence, actual outcome and uncertainty. Optimize the current operating point only when justified.
      Start with small measured moves; the full existing owner range is a ceiling, not a target jump. Measure fresh
      dither and position-free side peaks at every point. Record all explored points and keep the best practical
      measured point, even if a full window is not identified. Do not claim unobserved boundaries. Automatic scope
      now includes current, slow_loop and feedforward. Read background capabilities and actual runtime parameters
      first. For slow_loop use parameter_candidate with tec_gain, supervision_interval_s or piezo_center_dac; for
      feedforward use current_per_temperature. The approved bounds are TEC gain .01..5e-1, period 1..100 s, PZT
      center 30000..36000 count, TEC-current FF .5..2 V/V. Current/TEC excursion ceilings are 20/10 mV per intervention;
      the owner publishes a tighter effective return envelope when needed for the unchanged 20 s foreground deadline.
      Never treat a bound as a target jump. tec_dt_cap_s is not a tuning candidate. The worker requires four actual
      slow cycles plus fresh distinct native/optical evidence; a long period may need several minutes. No thermal
      excitation or poor optical quality means inconclusive, not a reason to force motion or weaken thresholds.
      Select a family justified by evidence; do not keep repeating a rejected trial. Save no candidate into persistent
      calibration/PI settings. Foreground operations preempt and restore this intervention checkpoint; never restore
      an old target. Teams remains disabled.
    adjustment_family: auto
    adjustment_plan_card_id: agent-monitor
    adjustment_objective: ''
  agent_execution:
    mode: required
    difficulty: standard
    escalation_profiles: []
- id: agent-monitor
  operation: agent.monitor
  uses: []
  parameters:
    task_card_id: agent-adjust
    agent_card_id: diagnostic-agent
    interval_s: 3600.0
    lookback_s: 3600.0
    sample_interval_s: 2.0
    conditions:
    - id: dither-high
      metric: dither_response
      above: 0.003
      clear_below: 0.0024
      persistence_s: 60
      cooldown_s: 900
      max_age_s: 10
    - id: frequency-offset
      metric: abs_error_hz
      above: 20000000.0
      clear_below: 10000000.0
      persistence_s: 60
      cooldown_s: 900
      max_age_s: 10
    background:
      enabled: true
      families:
      - current
      - slow_loop
      - feedforward
      half_span_v: 0.6
      max_points: 128
      timeout_s: 1800.0
      handoff_timeout_s: 20.0
      adjustment_parameters:
        slow_loop:
          objective: frequency_rms_hz
          window_s: 120.0
          min_samples: 60
          settle_s: 30.0
          max_sample_gap_s: 3.0
          timeout_s: 900.0
          minimum_improvement_fraction: 0.1
          maximum_cadence_fraction: 0.2
          minimum_tec_excursion_v: 0.0
        feedforward:
          objective: frequency_rms_hz
          window_s: 120.0
          min_samples: 60
          settle_s: 30.0
          max_sample_gap_s: 3.0
          timeout_s: 900.0
          minimum_improvement_fraction: 0.1
          maximum_cadence_fraction: 0.2
          minimum_tec_excursion_v: 0.0002
    prompt: Teams notifications are disabled. Do not post or enqueue Teams messages. Use current owner and recorded
      evidence; old failure records are not authority to restart locks. Do not change target, absolute physical
      limits, slew limits, calibration, firmware, or persistent PI settings. Human and program foreground operations
      take priority. Use only this task background grant for automatic effects. If the system is healthy, explain
      why no adjustment is needed. Do not repeatedly disturb a healthy lock. Do not force observation of a multimode
      state. Use historical drift/recovery behavior to judge practical quality. Keep the local result concise in
      English, with evidence, actual outcome and uncertainty. Automatic scope now includes current, slow_loop and
      feedforward. Read background capabilities and actual runtime parameters first. For slow_loop use parameter_candidate
      with tec_gain, supervision_interval_s or piezo_center_dac; for feedforward use current_per_temperature. The
      approved bounds are TEC gain .01..5e-1, period 1..100 s, PZT center 30000..36000 count, TEC-current FF .5..2
      V/V. Current/TEC excursion ceilings are 20/10 mV per intervention; the owner publishes a tighter effective
      return envelope when needed for the unchanged 20 s foreground deadline. Never treat a bound as a target jump.
      tec_dt_cap_s is not a tuning candidate. The worker requires four actual slow cycles plus fresh distinct native/optical
      evidence; a long period may need several minutes. No thermal excitation or poor optical quality means inconclusive,
      not a reason to force motion or weaken thresholds. Select a family justified by evidence; do not keep repeating
      a rejected trial. Save no candidate into persistent calibration/PI settings. Foreground operations preempt
      and restore this intervention checkpoint; never restore an old target. Teams remains disabled.
