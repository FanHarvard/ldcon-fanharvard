      target_frequency_hz: null
      tolerance_hz: 10000000.0
      target_wavelength_nm: null
      duration_s: null
      acquisition_timeout_s: 300.0
      sample_interval_s: 0.5
      max_sample_age_s: 1.0
    frequency-triangle:
      shape: triangle
      levels_hz:
      - -1000000
      - 1000000
      dwell_s: 0.1
      sample_rate_hz: 20000
      duration_s: 600
    frequency-staircase:
      shape: staircase
      levels_hz:
      - -1000000
      - 1000000
      dwell_s: 0.1
      sample_rate_hz: 20000
      duration_s: 600
