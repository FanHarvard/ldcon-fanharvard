name: Site validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pytest detect-secrets
      - run: python ops/check_public_files.py
      - run: python ops/check_secrets.py
      - run: python ops/site.py validate
      - run: python -m pytest -q
      - run: python tests/check_install_modes.py "$RUNNER_TEMP/install-modes"
      - run: python -m pip check
